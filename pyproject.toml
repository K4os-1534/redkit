[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redkit"
dynamic = ["version"]
description = "Modular menu-driven automated red teaming tool targeting web applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K4os" }]
keywords = [
    "security",
    "pentesting",
    "red-team",
    "web-security",
    "offensive-security",
    "vulnerability-assessment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# Pinned floors address known CVEs in older releases:
#   requests >=2.32.0  → CVE-2024-35195 (cert verification bypass)
#   jinja2   >=3.1.5   → CVE-2024-56201 / CVE-2024-56326 (sandbox escape)
dependencies = [
    "rich>=13.7.1,<16",
    "requests>=2.32.0,<3",
    "dnspython>=2.6.1,<3",
    "pyyaml>=6.0.2,<7",
    "jinja2>=3.1.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "pip-audit>=2.7",
]

[project.scripts]
redkit = "redkit.cli:main"

[project.urls]
Homepage = "https://github.com/K4os-1534/redkit"
Repository = "https://github.com/K4os-1534/redkit"
Issues = "https://github.com/K4os-1534/redkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redkit = ["wordlists/*.txt", "templates/*.j2"]

[tool.setuptools.dynamic]
version = { attr = "redkit.__version__" }

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["redkit"]

[tool.mypy]
python_version = "3.10"
files = ["src/redkit"]
exclude = ["build", "dist", "venv"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["dns.*", "yaml.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
