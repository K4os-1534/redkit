name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest --cov=redkit --cov-report=term-missing

      # Advisory database can change under a PR's feet; audit results are
      # surfaced but do not block merges. Review findings weekly.
      - name: Dependency audit
        run: pip-audit
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the wheel in a scratch venv
        run: |
          python -m venv /tmp/scratch
          /tmp/scratch/bin/pip install dist/*.whl
          /tmp/scratch/bin/redkit --version
          /tmp/scratch/bin/redkit --list-modules

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
